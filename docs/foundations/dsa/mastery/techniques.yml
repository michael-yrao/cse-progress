  # The base rung of the expression-evaluator family. RPN is the easy form because
  # the notation has already resolved precedence and parens — 224/227/772 are the
  # same stack with those two problems added back, and are the reason this rung
  # exists at all. Added Aug 11, 2026 via 150.
  - name: Stack (expression evaluation)
    family: stack
    min_problems: 2
    problems:
      - {number: 150}

  # Not a monotonic stack and not expression evaluation: the stack stores AUGMENTED
  # entries so a query that would otherwise be a scan becomes a read of the top. The
  # transferable idea is "carry the answer-so-far alongside each element", which is what
  # makes O(1) getMin survive a LIFO pop. Added Aug 12, 2026 via 155.
  - name: Stack (augmented entries)
    family: stack
    min_problems: 2
    problems:
      - {number: 155, method: Pair with Min-So-Far}

  - name: Monotonic Stack
    family: stack
