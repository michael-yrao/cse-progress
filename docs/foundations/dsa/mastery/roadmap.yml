# The numbered catalog of roadmap problems that have no tracker row and no Waiting
# Room row (decision `mastery-ratio-done-over-planned-sep26`) — the y = planned
# denominator's data source alongside techniques.yml's own `queued`/Waiting-Room
# problems. study_guide.md's phase table is the prose form of the same list; this is
# the machine-readable one, joined by `scripts/gamify.py`'s `load_roadmap()`.
#
# Regenerated BY HAND, not by a script: each entry's title/difficulty is looked up in
# cse-coach's curriculum/dsa/milestone.yml by LC number, the slug is normally derived
# the same way scripts/new_problem.py derives one (snake(title) with underscores
# turned to hyphens), and confirmed against the LeetCode GraphQL endpoint
# (questionFrontendId == number, isPaidOnly) the same way new_problem.py's
# verify_links() does — a premium problem's `url` is the NeetCode mirror
# (NEETCODE_RENAMES-aware), exactly as `new_problem.py --premium` would build it. Where
# LeetCode's own slug differs from the derived one, the entry uses the slug the lookup
# confirmed BY ID instead (50 → `powx-n`, not a derived `pow_x_n`/`pow-x-n`).
#
# A problem whose only tracker row sits outside the Waiting Room section (815, 1197 —
# dsa_progress.md's "Not from Grind 75" table) is cataloged here with that row's own
# title and link verbatim rather than re-derived from milestone.yml/LeetCode — the row
# is already the learner's own resolved source (1197's HelloInterview link, in
# particular, which is not a LeetCode or NeetCode URL at all).
#
# A number with no milestone.yml entry at all (1102) has its title/difficulty read
# straight off the LeetCode GraphQL lookup instead (new_problem.py's lookup_leetcode()
# for the title/isPaidOnly, a second minimal query for difficulty) — same endpoint,
# same by-id confirmation, just no milestone.yml roundtrip to confirm against.
#
# A number whose slug did not resolve, or whose id/difficulty disagreed, is left OUT
# rather than guessed.
#
# LINK ORDER (Sep 27, 2026, learner's words: "leetcode (free) -> neetcode (free) ->
# hellointerview (premium) in that order"; decision `problem-link-order-sep27`; step 4
# replaced Oct 4, 2026, learner's words: "new priority for problem links: leetcode (free)
# -> neetcode (free) -> hellointerview (premium) -> progressiveoverflow. if something
# doesn't exist in any of the above, make it available in progressiveoverflow"; decision
# `problem-link-order-oct04`):
#   1. LeetCode, when the problem is free there.
#   2. NeetCode, when LeetCode paywalls it AND NeetCode's own public list has it.
#   3. HelloInterview (the learner subscribes), when neither of the above and its catalog
#      has it.
#   4. progressiveoverflow (`https://progressiveoverflow.com/practice/<n>`), when none of
#      the three carries it; a practice spec is written so the page exists.
# Every step is CHECKED against that site's list, never guessed. NeetCode's site answers
# 200 for any slug, so a NeetCode link for a problem it does not list looks alive and is
# dead; that is why 1102 links progressiveoverflow below and not a NeetCode mirror.
#
# `phase` is one of: Backtracking, 1D-DP, 2D-DP, Bit-Math (an active/upcoming roadmap
# phase — the same spelling as techniques.yml's `queued: phase:<Name>` trigger), or
# `backlog` for an already-active core technique's next unrated rep, whatever its
# techniques.yml trigger (`surplus>=1`, `solved:127`, or none at all) — a problem
# "left over" from a technique that's already started, not a not-yet-open phase.
#
# Schema: {number, title, url, difficulty, phase} flow mappings, sorted by number.

