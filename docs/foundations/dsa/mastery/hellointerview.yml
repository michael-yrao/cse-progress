# Generated map: LeetCode slug -> HelloInterview catalog path.
#
# THE RULE (owner's decision, Sep 27 2026, owner's words: "leetcode (free) -> neetcode
# (free) -> hellointerview (premium) in that order" — see decisions.yml
# `problem-link-order-sep27` and `.claude/memory/reference_hellointerview_premium.md`):
#   1. LeetCode, when the problem is free there.
#   2. NeetCode, when LeetCode paywalls it AND NeetCode's own public list has it
#      (`docs/foundations/dsa/mastery/neetcode.yml`, generated).
#   3. HelloInterview (the owner's premium subscription — this file), when neither of the
#      above and its catalog has it.
#   4. None of the three: LeetCode's own page, stated as paywalled rather than hidden.
# Every step is checked against that site's own list, never guessed. Applies to planned
# problems and future scaffolds only — a tracked problem or an existing solution file is
# never relinked.
#
# HOW THIS FILE IS BUILT: generated by a one-off crawl of
# https://www.hellointerview.com/learn/code (the catalog page), joined ON THE LEETCODE
# SLUG EACH PAGE LINKS — never on the title, and never on HelloInterview's own slug, which
# frequently differs from LeetCode's (Meeting Rooms is `intervals/can-attend-meetings`).
# A page counts as a problem page only when it links EXACTLY ONE `leetcode.com/problems/*`
# slug; a page linking zero is a lesson page (skipped, not listed here); a page linking
# more than one is AMBIGUOUS (skipped, not listed here) — see the crawl report in the
# generating conversation for both lists. Re-run the crawl to refresh this file; it is not
# hand-maintained.
#
# Crawled: 2026-09-27. 120 distinct catalog paths -> 84 problem pages (below), 27 lesson
# pages excluded, 9 ambiguous pages excluded.
#
# "Exactly one slug" is necessary, not sufficient: a LESSON page that works one problem
# through as its example also links exactly one slug. Five such pages were excluded on
# review, because a lesson is not a page to solve the problem on:
#   /learn/code/prefix-sum/overview                         (subarray-sum-equals-k — which
#       also has its own dedicated page, kept below)
#   /learn/code/greedy/overview                             (assign-cookies)
#   /learn/code/dynamic-programming/fundamentals            (climbing-stairs)
#   /learn/code/dynamic-programming/solving-a-question-with-dp   (house-robber)
#   /learn/code/depth-first-search/global-variables         (count-good-nodes-in-binary-tree)
# When re-crawling, treat a path whose last segment names a lesson (overview,
# fundamentals, introduction, a concept name) as a lesson even if it links one slug, and
# compare each mapped path's last segment against its slug — a name that shares nothing
# with the slug is either a renamed problem (keep) or a lesson (drop); read the page.
#
# Stores the PATH only (e.g. `/learn/code/intervals/can-attend-meetings`), not the full
# URL — `scripts/new_problem.py`'s `HELLOINTERVIEW_HOST` constant supplies the host.

