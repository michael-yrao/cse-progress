number: 746
title: Min Cost Climbing Stairs
url: https://leetcode.com/problems/min-cost-climbing-stairs/
statement: |
  You are given an integer array cost where cost[i] is the cost of the ith
  step on a staircase. Once you pay the cost, you can either climb one or
  two steps.

  You can either start from the step with index 0, or the step with
  index 1.

  Return the minimum cost to reach the top of the floor.

  Example 1:
      Input:  cost = [10,15,20]
      Output: 15
      Explanation: Start at index 1, pay 15 and climb two steps
      to reach the top.

  Example 2:
      Input:  cost = [1,100,1,1,1,100,1,1,100,1]
      Output: 6
      Explanation: Start at index 0, then pay 1 for each of the
      steps at indexes 0, 2, 4, 6, 7 and 9 to reach the top.

  Constraints:
      2 <= cost.length <= 1000
      0 <= cost[i] <= 999
entry:
