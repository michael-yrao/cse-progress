number: 973
title: K Closest Points to Origin
url: https://leetcode.com/problems/k-closest-points-to-origin/
entry:
  class: Solution
  method: kClosest
signature: "points: List[List[int]], k: int -> List[List[int]]"
compare: unordered
# Any order is accepted (compare: unordered). No case has a distance tie at the
# k-th boundary (the k-th and (k+1)-th smallest squared distances differ), so the
# set of k points is unique; the generator asserted this for every case.
cases:
