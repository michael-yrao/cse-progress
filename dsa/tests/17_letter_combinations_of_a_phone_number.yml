# Any order is accepted, so compare is unordered. Each digit maps to the letters on a phone keypad:
# 2 abc, 3 def, 4 ghi, 5 jkl, 6 mno, 7 pqrs, 8 tuv, 9 wxyz. No digit maps to 1.
number: 17
title: Letter Combinations of a Phone Number
url: https://leetcode.com/problems/letter-combinations-of-a-phone-number/
statement: |
  Given a string containing digits from 2-9 inclusive, return all possible
  letter combinations that the number could represent. Return the answer in
  any order.

  A mapping of digits to letters (just like on the telephone buttons) is
  given below. Note that 1 does not map to any letters.

      2: abc    3: def    4: ghi    5: jkl
      6: mno    7: pqrs   8: tuv    9: wxyz

  Example 1:
      Input:  digits = "23"
      Output: ["ad","ae","af","bd","be","bf","cd","ce","cf"]

  Example 2:
      Input:  digits = "2"
      Output: ["a","b","c"]

  Constraints:
      1 <= digits.length <= 4
      digits[i] is a digit in the range ['2', '9'].
entry:
