number: 1135
title: Connecting Cities With Minimum Cost
url: https://leetcode.com/problems/connecting-cities-with-minimum-cost/
statement: |
  There are `n` cities labelled 1 to n. `connections[i] = [x, y, cost]` says that connecting
  city `x` and city `y` (in either direction) costs `cost`.

  Return the minimum total cost to connect all `n` cities so that there is a path between
  every pair of cities, using only the listed connections. If it is impossible, return -1.

  Example 1:
      Input:  n = 3
              connections = [[1,2,5],[1,3,6],[2,3,1]]
      Output: 6

  Example 2:
      Input:  n = 4
              connections = [[1,2,3],[3,4,4]]
      Output: -1

  Constraints:
      1 <= n <= 10^4
      0 <= connections.length <= 10^4
      connections[i].length == 3
      1 <= x, y <= n, x != y
      0 <= cost <= 10^5
entry:
  class: Solution
  method: minimumCost
signature: "n: int, connections: List[List[int]] -> int"
compare: exact
figure:
  kind: graph
  directed: false
  edgesArg: 1
