number: 503
title: Next Greater Element II
url: https://leetcode.com/problems/next-greater-element-ii/
entry:
  class: Solution
  method: nextGreaterElements
signature: "nums: List[int] -> List[int]"
compare: exact
cases:
  - {args: [[1, 2, 1]], expected: [2, -1, 2], example: true}
  - {args: [[1, 2, 3, 4, 3]], expected: [2, 3, 4, -1, 4], example: true}
  - {args: [[1]], expected: [-1]}
  - {args: [[5, 5, 5]], expected: [-1, -1, -1]}
  - {args: [[3, 2, 1]], expected: [-1, 3, 3]}
  - {args: [[1, 2, 3]], expected: [2, 3, -1]}
  - {args: [[-1000000000, 1000000000]], expected: [1000000000, -1]}
  - {args: [[1000000000, -1000000000]], expected: [-1, 1000000000]}
  - {args: [[2, 2, 3, 3]], expected: [3, 3, -1, -1]}
  - {args: [[3, 3, 2, 2]], expected: [-1, -1, 3, 3]}
  - {args: [[5, 4, 3, 2, 1, 5]], expected: [-1, 5, 5, 5, 5, -1]}
  - {args: [[1, 1, 1, 2]], expected: [2, 2, 2, -1]}
  - {args: [[2, 1, 2, 4, 3]], expected: [4, 2, 4, -1, 4]}
  - {args: [[-1, -2, -3]], expected: [-1, -1, -1]}
  - {args: [[0, 0]], expected: [-1, -1]}
  - {args: [[9, 1, 9, 1]], expected: [-1, 9, -1, 9]}
  - {args: [[1, 5, 3, 6, 8]], expected: [5, 6, 6, 8, -1]}
  - {args: [[-3, 0, -2, 1]], expected: [0, 1, 1, -1]}
  - {args: [[-3, 5, -5, -5, 1, -4]], expected: [5, -1, 1, 1, 5, -3]}
  - {args: [[-5, 3]], expected: [3, -1]}
  - {args: [[1, -5, -4, 5, 3, 0, 2, 4, 1]], expected: [5, -4, 5, -1, 4, 2, 4, 5, 5]}
  - {args: [[-1, 1, 5, -1, 2, -3, -1, 0, -4]], expected: [1, 5, -1, 2, 5, -1, 0, 1, -1]}
  - {args: [[-2, 3, 1, -3, -4, -5, -2, -2]], expected: [3, -1, 3, -2, -2, -2, 3, 3]}
  - {args: [[2, -1, -3, 3, 0, -4, 2]], expected: [3, 3, 3, -1, 2, 2, 3]}
  - {args: [[-3, -4]], expected: [-1, -3]}
