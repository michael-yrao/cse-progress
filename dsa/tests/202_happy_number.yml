number: 202
title: Happy Number
url: https://leetcode.com/problems/happy-number/
statement: |
  Write an algorithm to determine if a number `n` is "happy".

  A happy number is defined by the following process:
    - Starting with any positive integer, replace the number by
      the sum of the squares of its digits.
    - Repeat the process until the number equals 1 (where it
      will stay), or it loops endlessly in a cycle which does
      not include 1.
    - Those numbers for which this process ends in 1 are happy.

  Return True if n is a happy number, and False if not.

  Example 1:
      Input:  n = 19
      Output: True
      Explanation:
          1^2 + 9^2  = 82
          8^2 + 2^2  = 68
          6^2 + 8^2  = 100
          1^2 + 0^2 + 0^2 = 1

  Example 2:
      Input:  n = 2
      Output: False

  Constraints:
      1 <= n <= 2^31 - 1
entry:
  class: Solution
  method: isHappy
signature: "n: int -> bool"
compare: exact
