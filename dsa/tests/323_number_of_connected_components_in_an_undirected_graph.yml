number: 323
title: Number of Connected Components in an Undirected Graph
url: https://leetcode.com/problems/number-of-connected-components-in-an-undirected-graph/
statement: |
  You have a graph of n nodes. You are given an integer n and an array edges where edges[i] = [aᵢ, bᵢ] indicates that there is an edge between aᵢ and bᵢ in the graph.

  Return the number of connected components in the graph.

  Example 1:

  Input:
  n = 5, edges = [[0,1],[1,2],[3,4]]

  Output: 2

  Example 2:

  Input:
  n = 5, edges = [[0,1],[1,2],[2,3],[3,4]]

  Output: 1

  Constraints:

      1 <= n <= 2000
      1 <= edges.length <= 5000
      edges[i].length == 2
      0 <= aᵢ <= bᵢ < n
      aᵢ != bᵢ
      There are no repeated edges.
entry:
  class: Solution
  method: countComponents
signature: "n: int, edges: List[List[int]] -> int"
compare: exact
