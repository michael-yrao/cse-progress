number: 22
title: Generate Parentheses
url: https://leetcode.com/problems/generate-parentheses/
statement: |
  Given n pairs of parentheses, write a function to generate all combinations
  of well-formed (valid) parentheses.

  Return the list in any order.

  Example:
      n = 3  ->  ["((()))","(()())","(())()","()(())","()()()"]
      n = 1  ->  ["()"]

  Constraints:
      1 <= n <= 8
entry:
  class: Solution
  method: generateParenthesis
signature: "n: int -> List[str]"
compare: unordered
cases:
  - {args: [3], expected: ["((()))", "(()())", "(())()", "()(())", "()()()"], example: true}
  - {args: [1], expected: ["()"], example: true}
  - {args: [2], expected: ["(())", "()()"]}
  - {args: [4], expected: ["(((())))", "((()()))", "((())())", "((()))()", "(()(()))", "(()()())", "(()())()", "(())(())", "(())()()", "()((()))", "()(()())", "()(())()", "()()(())", "()()()()"]}
