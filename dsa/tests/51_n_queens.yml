# Any order of boards is accepted, so compare is unordered (top level only: the rows of one board are ordered).
# Stored cases stop at n = 6: n = 7 and above put one case line past the size cap (40 boards at n = 7).
number: 51
title: N-Queens
url: https://leetcode.com/problems/n-queens/
statement: |
  The n-queens puzzle is the problem of placing n queens on an n x n
  chessboard such that no two queens attack each other.

  Given an integer n, return all distinct solutions to the n-queens puzzle.
  You may return the answer in any order.

  Each solution contains a distinct board configuration of the n-queens'
  placement, where 'Q' and '.' both indicate a queen and an empty space,
  respectively.

  Example 1:
      Input:  n = 4
      Output: [[".Q..","...Q","Q...","..Q."],
               ["..Q.","Q...","...Q",".Q.."]]

  Example 2:
      Input:  n = 1
      Output: [["Q"]]

  Constraints:
      1 <= n <= 9
entry:
  class: Solution
  method: solveNQueens
signature: "n: int -> List[List[str]]"
compare: unordered
cases:
  - {args: [4], expected: [[".Q..", "...Q", "Q...", "..Q."], ["..Q.", "Q...", "...Q", ".Q.."]], example: true}
  - {args: [1], expected: [["Q"]], example: true}
  - {args: [2], expected: []}
  - {args: [3], expected: []}
  - {args: [5], expected: [["Q....", "..Q..", "....Q", ".Q...", "...Q."], ["Q....", "...Q.", ".Q...", "....Q", "..Q.."], [".Q...", "...Q.", "Q....", "..Q..", "....Q"], [".Q...", "....Q", "..Q..", "Q....", "...Q."], ["..Q..", "Q....", "...Q.", ".Q...", "....Q"], ["..Q..", "....Q", ".Q...", "...Q.", "Q...."], ["...Q.", "Q....", "..Q..", "....Q", ".Q..."], ["...Q.", ".Q...", "....Q", "..Q..", "Q...."], ["....Q", ".Q...", "...Q.", "Q....", "..Q.."], ["....Q", "..Q..", "Q....", "...Q.", ".Q..."]]}
  - {args: [6], expected: [[".Q....", "...Q..", ".....Q", "Q.....", "..Q...", "....Q."], ["..Q...", ".....Q", ".Q....", "....Q.", "Q.....", "...Q.."], ["...Q..", "Q.....", "....Q.", ".Q....", ".....Q", "..Q..."], ["....Q.", "..Q...", "Q.....", ".....Q", "...Q..", ".Q...."]]}
