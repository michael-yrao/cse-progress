number: 912
title: Sort an Array
url: https://leetcode.com/problems/sort-an-array/
entry:
  class: Solution
  method: sortArray
signature: "nums: List[int] -> List[int]"
compare: exact
cases:
  - {args: [[5, 2, 3, 1]], expected: [1, 2, 3, 5], example: true}
  - {args: [[5, 1, 1, 2, 0, 0]], expected: [0, 0, 1, 1, 2, 5], example: true}
  - {args: [[1]], expected: [1]}
  - {args: [[0]], expected: [0]}
  - {args: [[-50000, 50000]], expected: [-50000, 50000]}
  - {args: [[50000, -50000, 0]], expected: [-50000, 0, 50000]}
  - {args: [[3, 3, 3]], expected: [3, 3, 3]}
  - {args: [[1, 2, 3, 4]], expected: [1, 2, 3, 4]}
  - {args: [[4, 3, 2, 1]], expected: [1, 2, 3, 4]}
  - {args: [[2, 1]], expected: [1, 2]}
  - {args: [[-1, -1, 0, 0, -2]], expected: [-2, -1, -1, 0, 0]}
  - {args: [[16, -14]], expected: [-14, 16]}
  - {args: [[2]], expected: [2]}
  - {args: [[13, -8, 11, -9, 20, -16, 0]], expected: [-16, -9, -8, 0, 11, 13, 20]}
  - {args: [[6, -4, 6, 20, 10, -13, 5, -19, -2]], expected: [-19, -13, -4, -2, 5, 6, 6, 10, 20]}
  - {args: [[5, -10, 15, 1, 0, 14, 14, 20, 14, 3]], expected: [-10, 0, 1, 3, 5, 14, 14, 14, 15, 20]}
  - {args: [[-12, -9, -11, 3, -5, -16]], expected: [-16, -12, -11, -9, -5, 3]}
  - {args: [[-12, 16, 8, 9, -9, -2, -16, 15, 12, 10, -3, -2]], expected: [-16, -12, -9, -3, -2, -2, 8, 9, 10, 12, 15, 16]}
  - {args: [[8, 19]], expected: [8, 19]}
  - {args: [[-12]], expected: [-12]}
  - {args: [[3, -6]], expected: [-6, 3]}
