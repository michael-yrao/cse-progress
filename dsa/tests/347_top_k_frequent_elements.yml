# Every case has no frequency tie at the k-th / (k+1)-th boundary, so the answer set is unique.
number: 347
title: Top K Frequent Elements
url: https://leetcode.com/problems/top-k-frequent-elements/
entry:
  class: Solution
  method: topKFrequent
signature: "nums: List[int], k: int -> List[int]"
compare: unordered
cases:
  - {args: [[1, 1, 1, 2, 2, 3], 2], expected: [1, 2], example: true}
  - {args: [[1], 1], expected: [1], example: true}
  - {args: [[1, 1, 2], 1], expected: [1]}
  - {args: [[1, 1, 2, 2, 3], 2], expected: [1, 2]}
  - {args: [[-1, -1, -1, 2, 2, 3], 2], expected: [-1, 2]}
  - {args: [[4, 4, 4, 4, 5, 5, 5, 6, 6, 7], 3], expected: [4, 5, 6]}
  - {args: [[3, 3, 3, 1, 2], 1], expected: [3]}
  - {args: [[-10000, 10000, 10000], 1], expected: [10000]}
  - {args: [[5, 5, 6], 2], expected: [5, 6]}
  - {args: [[7, 7, 7, 8, 8, 9], 3], expected: [7, 8, 9]}
  - {args: [[0, -2, -5], 3], expected: [-5, -2, 0]}
  - {args: [[0, 5, -4], 3], expected: [-4, 0, 5]}
  - {args: [[-1, -1, -4, -4, -3, 4, -1, -2, 2, 5, -3, 4, -3, 3], 8], expected: [-3, -1, -4, 4, -2, 2, 3, 5]}
  - {args: [[-4, -4, 0, 1], 3], expected: [-4, 0, 1]}
  - {args: [[4, 3], 2], expected: [3, 4]}
  - {args: [[-3, 5, -4, 3], 4], expected: [-4, -3, 3, 5]}
  - {args: [[-4, -1, -1], 2], expected: [-1, -4]}
  - {args: [[-2, -1, -3, 5, 5, 0, -3, 5], 2], expected: [5, -3]}
  - {args: [[4, 2, -1, 0, 3, 3, 3, 2, 4, -1, -3], 1], expected: [3]}
  - {args: [[5, 3, -4, -1], 4], expected: [-4, -1, 3, 5]}
  - {args: [[4, 4, -3, -4, 1, 2, 0, -3, -3, -3, -2], 7], expected: [-3, 4, -4, -2, 0, 1, 2]}
  - {args: [[2, -3, 4, -2, -5, -5, 2, 0, 2, 0, -5, 2, 3, -1], 3], expected: [2, -5, 0]}
