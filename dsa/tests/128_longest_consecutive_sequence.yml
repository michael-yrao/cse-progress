number: 128
title: Longest Consecutive Sequence
url: https://leetcode.com/problems/longest-consecutive-sequence/
statement: |
  Given an unsorted array of integers nums, return the length of the longest consecutive elements sequence.

  You must write an algorithm that runs in O(n) time.

  Example 1:
      Input:  nums = [100,4,200,1,3,2]
      Output: 4
      Explanation: The longest consecutive elements sequence is
          [1, 2, 3, 4]. Therefore its length is 4.

  Example 2:
      Input:  nums = [0,3,7,2,5,8,4,6,0,1]
      Output: 9

  Example 3:
      Input:  nums = [1,0,1,2]
      Output: 3

  Constraints:
      0 <= nums.length <= 10^5
      -10^9 <= nums[i] <= 10^9
entry:
  class: Solution
  method: longestConsecutive
signature: "nums: List[int] -> int"
compare: exact
cases:
  - {args: [[100, 4, 200, 1, 3, 2]], expected: 4, example: true}
  - {args: [[0, 3, 7, 2, 5, 8, 4, 6, 0, 1]], expected: 9, example: true}
  - {args: [[1, 0, 1, 2]], expected: 3, example: true}
  - {args: [[10, -2, -4, -5, 11, 5]], expected: 2}
  - {args: [[-1000000000, -1000000000]], expected: 1}
  - {args: [[-2, 2, 9, 2, -6, 3, 3, 7]], expected: 2}
  - {args: [[-1000000000, 1000000000, -999999999, -999999999, 1000000000, -999999999, 999999999]], expected: 2}
  - {args: [[8, 11, 13]], expected: 1}
  - {args: [[5, 5, 9, 10, -3, 1, 1]], expected: 2}
  - {args: [[6, 3]], expected: 1}
  - {args: [[]], expected: 0}
  - {args: [[1, 0, 13, 7]], expected: 2}
  - {args: [[7, 2]], expected: 1}
  - {args: [[-1, 9, 7, 7, -6, 11, -6]], expected: 1}
  - {args: [[7, -1, 14]], expected: 1}
  - {args: [[3, 6, 11, 7, 9, 10, 6, -3]], expected: 3}
  - {args: [[11, -6, -3, -5, 0, -3, -2, 11]], expected: 2}
  - {args: [[-6, -4, 12, 4, 1]], expected: 1}
  - {args: [[-5, 11, 6]], expected: 1}
  - {args: [[1, 4, -3]], expected: 1}
  - {args: [[6]], expected: 1}
  - {args: [[1]], expected: 1}
  - {args: [[14, 4]], expected: 1}
  - {args: [[-999999999, -999999999, 1000000000, 0]], expected: 1}
  - {args: [[1000000000, -1000000000, 999999999, -999999999, 999999999, 999999999, -1000000000, 1000000000]], expected: 2}
  - {args: [[0, 999999999, 999999999, -999999999]], expected: 1}
  - {args: [[12, 11, 3, -5, 9, -4, -6]], expected: 3}
  - {args: [[4, 8]], expected: 1}
  - {args: [[-999999999, 0, -999999999, 999999999, 1000000000]], expected: 2}
  - {args: [[-5, 3, -2, -5]], expected: 1}
  - {args: [[999999999, -1000000000, -999999999, 999999999, 0, 0, 999999999, 1000000000]], expected: 2}
  - {args: [[-4, -5, 3, -4, -5, 13, 1, 7]], expected: 2}
  - {args: [[13]], expected: 1}
