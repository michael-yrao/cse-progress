number: 9002
title: Arbitrage
url: https://open.kattis.com/problems/arbitrage
statement: |
  You are given a list of currency codes, `currencies`, and a list of exchange rates.
  `rates[i] = [src, dst, rate]` means one unit of `src` buys `rate` units of `dst`.
  A rate applies in that direction only.

  An arbitrage is a sequence of exchanges that starts with some amount of one currency
  and ends with more of that same currency.

  Return `True` if an arbitrage exists, otherwise `False`.

  Example 1:
      Input:  currencies = ["USD","EUR","GBP"]
              rates = [["USD","EUR",0.9],["EUR","GBP",0.9],
                       ["GBP","USD",1.3]]
      Output: True

  Example 2:
      Input:  currencies = ["USD","EUR"]
              rates = [["USD","EUR",0.5],["EUR","USD",1.5]]
      Output: False

  Example 3:
      Input:  currencies = ["USD","EUR","JPY"]
              rates = [["USD","EUR",0.9]]
      Output: False

  Constraints:
      1 <= currencies.length <= 200
      0 <= rates.length <=
          currencies.length * (currencies.length - 1)
      All currency codes are distinct.
      src != dst, and there is at most one rate
          for each (src, dst) pair.
      0.01 <= rate <= 100

  In every stored case here, the product of the rates around any cycle is at most 0.99
  or at least 1.01, so rounding cannot change the answer.
entry:
  class: Solution
  method: hasArbitrage
signature: "currencies: List[str], rates: List[Tuple[str, str, float]] -> bool"
compare: exact
cases:
