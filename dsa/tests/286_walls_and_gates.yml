number: 286
title: Walls and Gates
url: https://leetcode.com/problems/walls-and-gates/
statement: |
  You are given an m x n grid `rooms`. Each cell holds one of three values:

      -1           a wall or an obstacle
       0           a gate
       2147483647  an empty room (INF)

  Fill each empty room with the number of steps to its nearest gate, moving up, down, left or
  right and never through a wall. If a room cannot reach any gate, leave it as INF.

  Modify `rooms` in place. Do not return anything.

  Example 1:
      Input:  rooms = [[INF,-1,0,INF],
                       [INF,INF,INF,-1],
                       [INF,-1,INF,-1],
                       [0,-1,INF,INF]]
      Output: [[3,-1,0,1],
               [2,2,1,-1],
               [1,-1,2,-1],
               [0,-1,3,4]]

  Example 2:
      Input:  rooms = [[-1]]
      Output: [[-1]]

  Constraints:
      m == rooms.length
      n == rooms[i].length
      1 <= m, n <= 250
      rooms[i][j] is -1, 0, or 2147483647.
