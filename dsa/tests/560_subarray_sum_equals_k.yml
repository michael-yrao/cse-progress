number: 560
title: Subarray Sum Equals K
url: https://leetcode.com/problems/subarray-sum-equals-k/
entry:
  class: Solution
  method: subarraySum
signature: "nums: List[int], k: int -> int"
compare: exact
cases:
  - {args: [[1, 1, 1], 2], expected: 2, example: true}
  - {args: [[1, 2, 3], 3], expected: 2, example: true}
  - {args: [[1], 1], expected: 1}
  - {args: [[1], 0], expected: 0}
  - {args: [[0], 0], expected: 1}
  - {args: [[0, 0, 0], 0], expected: 6}
