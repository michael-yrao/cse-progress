# The curated pick for the site's grounded-solutions showcase: one entry per (lc, variant).
# `variant` is the site's SolutionVariant.variant (kebab-case approach name, never a date).
# `container` defaults to "Solution" when omitted; an explicit `container: null` means the
# symbol IS a top-level class (a design problem — the class itself, not one of its methods).
# `file:` is REQUIRED only when a problem number has more than one solution file on disk (a
# "twin"). `helpers:` names extra module-level symbols (e.g. a linked-list node class) that
# are emitted as their own segments alongside the attempt.
#
# scripts/export_showcase.py --check refuses anything it can't resolve against the live
# solution files; see decisions.yml `showcase-contract` and scripts/showcase_candidates.py
# (the read-only tool that surfaces candidates for this file).
