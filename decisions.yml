  - id: problem-link-order-sep27
    date: 2026-09-27
    summary: >-
      ADDS a four-step link-order rule for a LeetCode problem (owner's decision, Sep 27,
      2026, owner's words: "leetcode (free) -> neetcode (free) -> hellointerview (premium)
      in that order" — see `.claude/memory/reference_hellointerview_premium.md`): 1.
      LeetCode, when the problem is free there. 2. NeetCode, when LeetCode paywalls it AND
      NeetCode's own public list has it. 3. HelloInterview (the owner's premium
      subscription), when neither of the above and its catalog has it. 4. None of the
      three: LeetCode's own page, stated as paywalled rather than hidden. Every step is
      CHECKED against that site's own list, never guessed. Scope: PLANNED problems and
      future scaffolds only — a tracked problem or an existing solution file is never
      relinked (252/1197 were relinked in `roadmap.yml` by hand, ahead of and independent
      of this entry).

      ⚠️ CORRECTION, same day: this entry is RENAMED from
      `hellointerview-premium-link-order-sep27`, not merely edited in place — that first
      version, built an hour earlier from a menu that never offered "NeetCode first", put
      HelloInterview AHEAD of the NeetCode mirror and had `resolve_premium_link()` guess an
      unlisted NeetCode URL rather than checking NeetCode's own list; the learner then
      stated the four-step order outright, and every reference to the old id (`scripts/
      new_problem.py`, `scripts/links.py`, `hellointerview.yml`'s header; `roadmap.yml`
      already used the new id) is updated to this one in the same edit that fixes the code.

      JOIN METHOD (HelloInterview). HelloInterview's own slugs frequently differ from
      LeetCode's (Meeting Rooms is `intervals/can-attend-meetings`), so the map is joined ON
      THE LEETCODE SLUG EACH HELLOINTERVIEW PAGE LINKS, never on the title and never on
      HelloInterview's own slug. A one-off crawl of `https://www.hellointerview.com/learn/
      code` (the catalog page) collects every `/learn/code/<pattern>/<slug>` path, fetches
      each individually (sequential, polite, a real `User-Agent`), and extracts the
      `leetcode.com/problems/*` link(s) the page carries: exactly one -> a problem page
      (mapped); zero -> a lesson page (skipped); more than one -> AMBIGUOUS (skipped,
      reported, never mapped).

      CRAWL RESULT (2026-09-27): 120 distinct catalog paths -> 84 problem pages mapped, 27
      lesson pages skipped, 9 ambiguous pages skipped (multiple LeetCode links — mostly a
      pattern's own `overview`/fundamentals page worked through several examples); 84 + 27
      + 9 = 120, the full catalog. Of the 27 lesson pages, 22 link no LeetCode problem at
      all, and FIVE link exactly one — a lesson that works a single problem through as its
      example. "Exactly one slug" is therefore necessary, not sufficient. The engineer
      caught one of the five by an accounting mismatch (`/learn/code/prefix-sum/overview`
      duplicated the dedicated page for `subarray-sum-equals-k`); the tech lead's review
      caught the other four by comparing each mapped path's last segment against its slug
      (`greedy/overview` -> assign-cookies, `dynamic-programming/fundamentals` ->
      climbing-stairs, `dynamic-programming/solving-a-question-with-dp` -> house-robber,
      `depth-first-search/global-variables` -> count-good-nodes-in-binary-tree). None of
      the five is LeetCode-premium, so no link would have been wrong in practice; they are
      excluded because the map must be true, not merely harmless.

      NEETCODE LIST (2026-09-27). Fetched live from `https://raw.githubusercontent.com/
      neetcode-gh/leetcode/main/.problemSiteData.json` (188343 bytes) -> 450 source entries
      -> 450 rows emitted (8 premium, 442 free) into `docs/foundations/dsa/mastery/
      neetcode.yml`, 0 malformed-link / 0 no-leading-number / 0 duplicate-slug anomalies.

      OUTCOME FOR THE PLANNED LEETCODE-PREMIUM PROBLEMS ON RECORD, checked against BOTH
      lists: 252 Meeting Rooms and 253 Meeting Rooms II resolve to NeetCode (its own list
      carries both, `premium: true`) — 253 changes from the first version's HelloInterview
      pick; 1197 Minimum Knight Moves resolves to HelloInterview (NeetCode's list does not
      carry it; HelloInterview's catalog does — already reflected in `roadmap.yml`, ahead
      of this crawl); 1102 Path With Maximum Minimum Value and 1135 Connecting Cities With
      Minimum Cost resolve to LeetCode's own paywalled page (neither list has either).

      IMPLEMENTATION. New `docs/foundations/dsa/mastery/neetcode.yml` (see NEETCODE LIST
      above), alongside the existing `docs/foundations/dsa/mastery/hellointerview.yml`.
      `scripts/new_problem.py` gains `load_neetcode_slugs()` (fail-soft like
      `load_hellointerview_map()`, but returns `None` — UNKNOWN — for an unreadable file
      rather than an empty set, so an unreadable list is never mistaken for "NeetCode lists
      nothing") and a single `resolve_premium_link(slug, neetcode_slugs, hi_map) ->
      PremiumLink` (a NamedTuple of `url`, `judge`, `reason`) replacing the old
      `resolve_premium_link()`/`_premium_reason()` pair, so the printed NOTE and the URL it
      names can never disagree. Used at both premium call sites — the auto-detected
      `isPaidOnly` branch in `verify_links()` and the explicit `--premium` branch in
      `main()`. `verify_links()`'s early-return link-check warning (a hand-passed or
      already-NeetCode URL) is corrected to check NeetCode's own list too, and to check
      `NEETCODE_RENAMES.values()` (the NeetCode-side slug the URL actually carries) rather
      than its keys — the old check's bug, which warned on every correctly-renamed slug.
      No `cse.config.yml` value changed. See `docs/foundations/dsa/mastery/neetcode.yml`
      (new), `scripts/new_problem.py` (`NEETCODE_MAP_PATH`, `load_neetcode_slugs`,
      `PremiumLink`, `resolve_premium_link`, `verify_links`), `scripts/links.py` (comment
      only), `docs/foundations/dsa/mastery/hellointerview.yml` (header only),
      `scripts/test_new_problem.py` (extended).

      AMENDED same day (owner's words: "leetcode (free) -> neetcode (free) ->
      hellointerview (premium) -> others"): a new fourth step, ahead of the paywalled
      fallback (now fifth) — another judge that carries the same problem (Kattis, CSES, LintCode…),
      found by hand and passed as `--url`; the scaffold says so when it cannot be
      confirmed free. The owner wants every rep submitted somewhere; a problem with no
      free place to practice is SKIPPED for now and a free same-shape problem sought
      instead ("if nowhere available to practice it, we can skip it for now"). First
      case: 1102 — LintCode 1418 is premium too, so it is skipped.
      `resolve_premium_link()` is unchanged: step 4 is manual.
    affects: [links, scaffolding]

  - id: coverage-threshold-formula-sep27
    date: 2026-09-27
    summary: >-
      REPLACES the per-technique coverage bar's hand-set `min_problems` (a flat default of
      3, individually overridden on ~74 of 105 techniques.yml entries) with a COMPUTED
      threshold. A single fixed default did not fit a vocabulary spanning techniques with
      one declared problem and techniques with a dozen — the flat number was either too
      loose on a thin technique or too tight on a broad one, and each mismatch was patched
      by hand, one at a time, forever.

      FORMULA (`cse.config.yml`'s new `coverage_threshold` block: `plan_share: 0.5,
      floor_min: 1, floor_max: 5`):

          floor     = clamp(ceil(plan_share * declared), floor_min, floor_max)
          threshold = floor + unclean

      `declared` is the technique's own distinct declared problem count (`techniques.yml`'s
      `problems:`, excluding a number whose every spec opts out via `planned: false` — the
      same rule `gamify.py`'s `_all_opted_out` already applies to the dashboard's `planned`
      list). `unclean` is how many of the technique's CREDITED problems (tracker-matched,
      distinct numbers) are still 🔴/🟡 best comfort — added on top of the floor because a
      shaky rep hasn't earned its coverage credit yet, whether the floor came from the
      formula or a manual override. A technique's own `min_problems:` in techniques.yml,
      when still present, REPLACES the formula's floor only; `unclean` is still added on
      top either way — so the formula never lets a genuinely shaky technique read as
      "covered" just because someone hand-picked a low floor once.

      BASIS. Two ideas combined, deliberately: (1) the N-consecutive-correct rule tutoring
      systems use for mastery (a skill isn't "known" from one clean rep — it needs a run of
      them, which is also this repo's own `graduate_at_streak` logic for a single problem,
      applied here at the TECHNIQUE level via `unclean`), and (2) sizing the bar as a SHARE
      of what's actually planned for that technique, rather than a constant — a technique
      declaring 1 problem and one declaring 12 cannot honestly want the same number.
      Declared variations, difficulty and company demand are DELIBERATELY left out of the
      formula: variations are a separate, per-technique gap check (`variant:` in the Gaps
      cell) and folding them into the same number double-counts one problem drilled twice
      as if it were two; difficulty and demand size WHICH problems to pull, not how many
      count toward being "covered".

      IMPLEMENTATION. `scripts/technique_coverage.py`: `compute_coverage_threshold()` (pure,
      table-tested) computes `(floor, threshold)`; `Resolved` gains `coverage_floor` and
      `unclean_count` alongside `min_problems` (now the computed threshold); the Min column
      renders `threshold (floor+unclean)` (e.g. `8 (4+4)`), still schema-compatible with
      `gamify.parse_techniques()`'s existing "first integer in the cell" read, extended to
      also read the two parenthesised integers into `coverageFloor`/`uncleanCount`
      (additive fields; an older report's bare-integer Min cell falls back to
      floor=minProblems, unclean=0). `techniques.yml` loses its `defaults.min_problems`
      block and EVERY explicit `min_problems:` key, whether or not it matched the formula.
      The two entries whose comment had reasoned about the old value (Hierholzer, Design
      (composed data structures)) carry an inline note for the learner's review, since the
      computed floor is LOWER than the old hand-picked one there. `company_demand.py` and `technique_comfort_audit.py` (the
      other two `technique_coverage.resolve()` callers) pass the loaded
      `coverage_threshold` config through unchanged.

      VERIFIED against a dry run's five spot-checked techniques (Greedy (single pass) 4+4=8
      done 6; Backtracking 5+2=7 done 4; Two Pointers (converging) 4; Grid DFS 1; Prim's MST
      1) — all five matched exactly once `declared` was computed as DISTINCT problem
      numbers (Hierholzer's two methods on 332 count once, not twice), confirming the
      formula was never the thing under-specified in the dry run — only the numerator was.
    affects: [technique_coverage, gamify, mastery]

