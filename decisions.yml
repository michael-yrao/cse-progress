    affects: [scheduling, weekly_build]

  - id: external-judge-problems-sep26
    date: 2026-09-26
    summary: >-
      ADDS a synthetic-id convention for a problem sourced from a judge other than
      LeetCode/NeetCode: a 4-digit id in 9001–9999 (the toolchain's own regexes are
      `\d{1,4}`; 5 digits would be silently dropped), living under the existing tracked
      root in its normal pattern folder, with the file header carrying the REAL judge URL
      — the id is the tracker join key exactly as an LC number is. Origin: the learner
      wants a Bellman-Ford-only rep (negative edges / negative-cycle detection) that must
      be submittable on a real judge; LeetCode/NeetCode have no such problem. Sourcing
      rule honored (`coverage-sibling-pulled-not-authored`): pull first, hand-pick only
      when the pull yields too little — the Sep 26, 2026 shortest-path company pull is
      LeetCode-only and yielded zero negative-edge problems, so the hand-pick condition is
      met. Hand-picked from Kattis: `shortestpath3` (SSSP, negative weights, -Infinity
