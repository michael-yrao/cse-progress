  - id: showcase-contract
    date: 2026-09-22
    summary: >-
      The progressiveoverflow.com algorithm visualizers stop storing a hand-pasted copy of the learner's
      Python: the site never carries solution code of its own again. cse-progress instead emits
      `dashboard/showcase.json` (schema `dashboard/showcase.schema.json`) from a new hand-curated manifest
      `dashboard/showcase.yml` — one entry per (lcNumber, variant), picking a specific attempt/method by
      symbol name (every attempt already lives in ONE file as a dated method inside `class Solution:`, or
      a dated class for a design problem, so "pick a version" means picking a method/class by name, not a
      commit). `scripts/export_showcase.py` reads the manifest + the live solution files and emits a
      byte-identical (EOL-normalized), line-numbered slice per entry — `container` (the `class Solution:`
      header), `attempt` (the picked def/class, its leading `#`-comment banner folded in), and any
      `helper` segments — so the site can render code provably identical to what's in the repo instead of
      a driftable copy, and link straight to the real GitHub line range. `scripts/showcase_candidates.py`
      is the new read-only tool that surfaces candidates (comment density, attempt date, RECOGNITION
      notes) for a human to pick from; it never writes the manifest itself. Unlike `gamify.py`,
      `export_showcase.py` is deliberately NOT fail-soft: an unresolvable manifest entry (unknown symbol,
      a twin problem number missing its required `file:`, a container mismatch, a stale committed
      `showcase.json`) is a hard failure (`--check` exits 1), because a stale or wrong showcase contract
      is exactly the drift this tool exists to remove. Renaming or deleting a manifest-selected
      symbol/method is now a BREAKING CHANGE, surfaced immediately by `--check` (wired into
      `.githooks/pre-commit`, report-only) and by the site's own scheduled groundedness check — this
      strands any prose that still describes the site as storing or hand-copying solution code, or that
      describes cse-progress's showcase.json as anything other than the one contract that deliberately
      carries verbatim, curated source (progress.json stays code-free and curated the other way — no
      solution code, ever). `links.py` gained `resolve_title_url(number, path)` (header-over-tracker,
      extracted out of `link_line()`, which now calls it too — one implementation of that precedence,
      reused by `export_showcase.py`). No `cse.config.yml` value changed. See `dashboard/showcase.yml`,
      `scripts/export_showcase.py`, `scripts/showcase_candidates.py`, `dashboard/showcase.schema.json`,
      `.claude/memory/project_gamification.md`.
    affects: [gamification]

  - id: schedule-item-end-status-sep23
    date: 2026-09-23
    summary: >-
      ADDS three ADDITIVE fields to the progress.json schedule-item contract (dashboard/progress.schema.json,
      scripts/gamify.py): `endComfort` (the first comfort glyph in the row's E cell, or null — never falling
      back to startComfort, so the board shows only what was actually earned this rep, not the start comfort
      carried forward as if it were the outcome), `endNote` (the E cell's free-form note after its glyph,
      stripped/collapsed/lowercased, maxLength 16 — vocabulary seen in real weeks: s0, s1, s2, prov,
      dropped — emitted ONLY when endComfort is non-null, null otherwise even if the raw cell had trailing
      text), and `nextReview` (the row's Next cell iff, once stripped, it is nothing but an ISO date; null
      for a free-form or blank Next cell). Closes the gap where a board row showed a rep was done but never
      how it ended — the E glyph and Next date were already parsed for the comfort timeline
      (`_scan_week`/`build_schedule_index`) but never emitted on the board slice
      (`_parse_schedule_day_full`). `_scan_week`'s own End-glyph read is refactored onto the same new
      `_end_glyph()` helper (with its start-glyph fallback preserved there — only the board slice refuses
      the fallback), and the new `_schedule_item_outcome()` helper is self-contained (only `eb.GLYPH` + `re`)
      so it ports verbatim to `cse-coach/scripts/gamify.py`. All three fields are additive only; the six
      existing required fields (lcNumber, title, technique, startComfort, difficulty, done) are unchanged,
      so nothing that already reads the prior contract breaks. No `cse.config.yml` value changed. Strands
      any wording that says a board/schedule item carries only its start comfort, or that the E
      glyph/Next date are parsed only for the comfort timeline and never exposed on the board. See
      `dashboard/progress.schema.json`, `scripts/gamify.py`, `.claude/memory/project_gamification.md`.
    affects: [gamification, scheduling]

  - id: rating-ignores-complexity
    date: 2026-09-23
    summary: >-
      The comfort rating no longer considers complexity AT ALL. The complexity gate itself is
      unchanged — the coach still asks the learner for time AND space, each with an itemized
      why-clause, before every rating (rating_gate.py unchanged). What changes is the consequence: a
      wrong, prompted, or taught Big-O bound never lowers or caps the rating, on any rep. Rating is
      judged on recognition + code only. Every complexity miss is still corrected, carded in
      complexity_gotchas.md, and queued into the end-of-week complexity cleanup, which re-asks it
      cold on the existing code — only the rating consequence is gone. SUPERSEDES the clean-code-only
      scope of `complexity-cleanup-formalized` (Sep 3, 2026): that waiver applied only when
      recognition AND code were clean off a blank page, and its scope sentence ("if the code needed a
      real fix, the normal freebie→🟡 cap stands") is now wrong. A real CODE fix still affects the
      rating through the code criterion; the complexity miss itself never does, whether or not the
      code also needed a fix. Retires rule 2's freebie/repeat-🟡 cap in complexity_gotchas.md as a
      rating mechanism (the ledger stays, now tracking category transfer only). Learner: "Rating
      should ignore Big-O going forward — we will be doing the complexity gate at end of the week to
      clear them up as we go." No `cse.config.yml` value changed. Strands: "correct complexity" as a
      🟢 criterion; a complexity miss capping a rating; "clean code + Big-O miss" as the waiver's
      scope (now every rep). See CLAUDE.md gate 1, `SKILL.md` §2/§3, `review-workflow.md` step 1,
      `spaced-repetition.md`, `weekly-build.md`, `complexity_gotchas.md`,
      `.claude/memory/feedback_ask_complexity.md`.
    supersedes: [complexity-cleanup-formalized]
    affects: [complexity_gate, ratings, complexity_gotchas, feedback_ask_complexity, weekly_closeout]

  - id: bigo-contract
    date: 2026-09-24
    summary: >-
      ADDS the site's Big-O Trainer as a second grounded-code contract, mirroring `showcase-contract`
      (Sep 22): a new hand-curated manifest `dashboard/bigo.yml` → `scripts/export_bigo.py` →
      `dashboard/big-o.json`, deployed by the site as a picker (All/Easy/Medium/Hard + a "my complexity
      misses" toggle) dealing a capped run from the learner's own solution files, replacing the trainer's
      old hand-written 26-question paraphrase array (`big-o-questions.data.ts`, retired once
      `scripts/seed_bigo.py` has consumed it). PICK RULE: each entry resolves to the latest DATED attempt
      in its file (by the symbol's `_YYYYMMDD` suffix or its banner comment — `es.attempt_date`); a tie
      (same date, e.g. a helper class + its Solution) is broken by the symbol LOWEST IN THE FILE; a file
      with no dated attempt at all (648, 76, both 1216 twins) requires an explicit `symbol:` in the
      manifest instead — a hard error otherwise. LABELS: one ordered canonical pool
      (`export_bigo.COMPLEXITY_POOL`) replaces the site's inconsistent spellings (`O(m × n)`, `O(V + E)`,
      `O(1) amortized`); the site checks answers by EXACT STRING EQUALITY against the pool, and each
      question's 4 options are seeded deterministically (`random.Random(f"{key}|{axis}|{correct}")`) —
      confusable distractors first, topped up from nearby pool labels — so the same entry always offers
      the same distractors.
      `isMiss` is read from `docs/foundations/dsa/mastery/complexity_gotchas.md`'s cleanup-queue + ledger
      tables (`parse_miss_numbers`); `difficulty` is joined from the tracker via
      `effort_budget.parse_rows()` (NOT `technique_coverage.py`, which `pip install`s on import — mirrors
      `gamify.py`'s existing avoidance). A manifest entry whose bound is `TODO` (unmapped or unseeded) is
      SKIPPED with a warning, never emitted — filling `TODO` bounds and verifying the seeded ones is left
      to the learner as an ordinary rep, never delegated (coaching carve-out; the plan only seeds).
      `scripts/export_showcase.py` gained a `label: str = "showcase.json"` kwarg (threaded through the
      shared `--check`/staleness helpers so their messages read correctly when reused for `big-o.json`)
      and a factored `check_leading_number(path, lc, key)`, both reused by `export_bigo.py`. Hook wiring
      is REPORT-ONLY, same as `showcase-contract` (`.githooks/pre-commit`, `|| true` on regenerate and
      `--check`). No `cse.config.yml` value changed. Strands any prose that still describes the Big-O
      trainer as a fixed hand-written 26-question set, or that says the trainer's questions are paraphrased
      rather than the learner's real code. See `dashboard/bigo.yml`, `scripts/export_bigo.py`,
      `scripts/seed_bigo.py`, `dashboard/big-o.schema.json`,
      `.claude/memory/project_grounded_solutions.md`.
    affects: [gamification]

  - id: progress-solution-file-sep24
    date: 2026-09-24
    summary: >-
      ADDS one ADDITIVE field, `file`, to the progress.json `problem` and `scheduleItem` contracts
      (dashboard/progress.schema.json, scripts/gamify.py): the repo-relative POSIX path of the learner's
      own solution file for that lcNumber, or null when none exists under the configured source roots.
      Resolved from a NEW `links.solution_files()` (one glob over `cse.config.yml` `solutions.roots`,
      keyed by the file's leading number — the same identity rule as `links.find_file` /
      new_problem.py's twin check); a twin (two files for one number, e.g. 1216) takes the first sorted
      path with one gamify warning per number. WHY: progressiveoverflow.com's Progress page (Problems
      tab + Today board) carried a LeetCode link and, for the ~95 visualized problems, a `</>`
      walkthrough — but no link to the learner's own file at all, so a problem with no visualizer and
      no curated `showcase.yml` entry (39, 846, 1489 on Sep 23) showed nothing beyond a comfort glyph.
      The site now renders a muted `src` link → `github.com/<owner>/<repo>/blob/<branch>/<file>`
      (honouring `?repo=`) on every row that has a file — zero curation, published by the same
      pre-commit gamify run that already fires on any staged solution file. This is STAGE 1 of the
      learner's Sep 24 ask ("automatically upload solution files if they are new … or link to the
      solution in my github"); stage 2 (an auto-filled showcase entry per uncurated file + an inline
      code viewer on row expand) is deliberately DEFERRED until the learner has seen how the link
      reads. `file` is a PATH, never code — progress.json stays code-free (`showcase-contract`).
      No `cse.config.yml` value changed. Strands any prose saying a progress row / board item carries
      only a LeetCode link, or that a problem reaches the site only through `showcase.yml`. See
      `dashboard/progress.schema.json`, `scripts/gamify.py`, `scripts/links.py`,
      `.claude/memory/project_gamification.md`, `.claude/memory/project_grounded_solutions.md`,
      `~/.claude/plans/can-we-find-a-vast-flask.md`.
    affects: [gamification]

  - id: output-quality-standard-sep25
    date: 2026-09-25
    summary: >-
      ADDS an output-quality standard for every coaching turn: four dimensions (F1, groundedness,
      narrative quality, readability), a turn shape (one message, sent after the last tool call,
      with no text between tool calls except one short line before a long mechanical run), a
      per-moment content contract (required/forbidden items for an answer, a concept teach, a
      stuck hint, a rating proposal, a work report, a board/hand-over, a close-out report, an SD
      mock debrief), a groundedness Stop hook, and an LLM judge + eval suite. New files:
      `references/output-quality.md`, `.claude/hooks/grounded_claims.py`,
      `.claude/memory/feedback_output_quality.md`, `scripts/judge_output.py`, and
      `.claude/skills/cse-coach/evals/`. `cse.config.yml` gains an `output_quality:` block
      (`judge_model`, `pass_threshold`, `readability.max_sentence_words`); no existing key's
      value changed. Strands any wording that has the coach narrate progress mid-turn before the
      answer is complete, present a partial board or a tentative rating that gets revised later,
      or split one answer across several messages. Does NOT strand "lead with the spine, then
      stop and check in" (SKILL.md §1) — that stop follows a COMPLETE spine answer and invites
      the learner's next move; it is not mid-turn narration. See `references/output-quality.md`,
      `feedback_output_quality.md`.
    affects: [turn_economy, token_discipline, self_evaluation, hooks, reporting]

  - id: workload-series
    date: 2026-09-25
    summary: >-
      ADDS a `workload` array to `progress.json`/`progress-summary.json`: one entry per scheduled
      day (live + archive) — `{date, planned, done, built, partial}`, planned from the day header's
      stated unit total, done/built priced from its rows. `effort_budget.py`'s `price_schedule_day()`
      (prices a day but only prints) is split so the pricing core is reusable: the new
      `price_day_items(day, items, rows, cfg)` is a behaviour-preserving extraction of its loop, and
      `gamify.py`'s new `build_workload(rows, cfg)` calls it once per scheduled day. `done`/`built`
      are re-priced under the CURRENT `cse.config.yml` weights, not whatever a day was billed at
      when it was built — so the series lets the dashboard compare planned vs completed units over
      time, but history is comparable to TODAY's weights, never to what a schedule's own Start
      column implied at build time. In `progress-summary.json` the array is capped to the same
      rolling window as `studyDays` (`SUMMARY_STUDY_DAYS_WINDOW`); `progress.json` keeps every
      scheduled day, uncapped. No `cse.config.yml` value changed. See `dashboard/progress.schema.json`
      (`workloadDay`), `scripts/effort_budget.py`, `scripts/gamify.py`.
    affects: [gamification]

  - id: badge-catalog-full-spectrum-sep26
    date: 2026-09-26
    summary: >-
      CHANGES the Full Spectrum (`all-green`) badge's earned criterion: it used to fire once
      every STARTED technique had a green (`technique_coverage.md`'s `noGreen == 0` with at
      least one started); it now requires a green in EVERY technique in `techniques.yml`
      (`stats["techniques"]`, one entry per row, `hasGreen`), so an untouched technique keeps
      it locked even when everything started is clean. ADDS an additive `progress: {current,
      target}` field to every counter badge (the streak milestones, the mastered/graduated-
      or-retired milestones, and Full Spectrum) — how far toward the target, present whether
      or not the badge is earned; a one-shot event badge (first-clean, first-hard-clean,
      first-graduate, first-retire, comeback) never carries it, since there is no current/
      target for an event that either happened or hasn't. Also fixes the mastered-milestone
      description's plural ("1 problem" vs "N problems"). No `SCHEMA_VERSION` bump (both
      changes are additive/non-breaking) and no `cse.config.yml` value changed. Separately,
      the progressiveoverflow.com site is removing its Trophy case card from the dashboard
      UI (a site-repo change, not this repo's) — the JSON contract's `trophyCase` key is
      retained and still emitted unchanged (additive discipline); nothing here touches it.
      See `scripts/gamify.py`
      (`compute_badges`), `dashboard/progress.schema.json` (`badges.items.properties.progress`),
      `.claude/memory/project_gamification.md`.
    affects: [gamification]

  - id: technique-builds-on-sep26
    date: 2026-09-26
    summary: >-
      ADDS `builds_on` to the `techniques.yml` vocabulary (an optional list of technique
      `name`s a technique presupposes — a name must exist in this file, no self-reference,
      the graph must stay acyclic) and `buildsOn`/`graduatedCount` to
      `progress.json`/`progress-summary.json`'s per-technique contract. `scripts/gamify.py`
      gains a pure `enrich_techniques(rows, yaml_entries, comfort_by_number, warnings)`,
      called from `build_payload` right after `build_problems` (not literally right after
      `parse_techniques`, since `graduatedCount` needs `build_problems`'s own output):
      `buildsOn` is the YAML entry's `builds_on`, validated (an unknown name or a self-edge
      dropped + warned) and cycle-broken (one back edge per cycle dropped + warned,
      deterministic DFS in the file's own order); `graduatedCount` is how many of the row's
      `problems` (LC numbers) have reached `LEVEL["🎓"]` or better in
      `comfort_by_number` — built from `build_problems`'s output plus `parse_retired()`'s
      list (mapped to 🏆), never a second read of the tracker. 93 of 98 techniques carry
      `builds_on`; 5 roots (Hash Map Lookup, Array/String Fundamentals, Dummy Node,
      Recursion, Number Theory) carry none. Purely additive: no `SCHEMA_VERSION` bump, no
      `cse.config.yml` value changed. `technique_coverage.py` ignores the new `builds_on`
      key (it reads known keys via `.get(...)`), so `technique_coverage.md` is unaffected.
      Consumer: the progressiveoverflow.com site's skill tree (a technique's prerequisite
      edges + how much of it is graduated). See `docs/foundations/dsa/mastery/techniques.yml`
      (schema header), `scripts/gamify.py` (`enrich_techniques`, `_comfort_by_number`,
      `_break_cycles`), `dashboard/progress.schema.json` (`definitions.technique`),
      `.claude/memory/project_gamification.md`.
    affects: [gamification]

  - id: company-demand-families-sep26
    date: 2026-09-26
    summary: >-
      ADDS `scripts/company_demand.py` → `docs/foundations/dsa/mastery/company_demand.md`:
      per-tier demand from the liquidslr company-wise lists, joined to `techniques.yml`
      families. Run by hand at the weekly build (`python scripts/company_demand.py --tier
      all`) — needs the network, so it is NOT wired into the pre-commit hook, unlike
      `technique_coverage.py`. ADDS four not-started `tier: core` families to
      `techniques.yml` — `strings`, `math_sim`, `design`, `bit_manipulation` — placed by
      the big-tech top-100 shares from the pull: String 22/100, Math 13/100 + Simulation
      3/100, Design 7/100 (12/40 data-platform, 13/100 supplementary), Bit Manipulation
      2/100 (4/100 fintech, 7/100 supplementary) `single-source-ok`. Those are TAG shares
      (a problem carries several tags); the report's per-family demand is lower for
      `strings`/`math_sim` because a multi-tag problem is assigned ONE family by
      `FAMILY_PRIORITY`, and a tracked problem takes the family of its vocabulary credit
      — so "strings 2%" in the report and "String 22/100" here measure different things
      and do not contradict each other. Math/Sim and Bit
      Manipulation are already the existing NC150 Dec 7–28 phase (study_guide.md), not a
      new curriculum addition — the vocabulary was simply missing an entry for a phase
      already on the schedule. Sorting is deliberately NOT added — the family already
      exists. Rule: a demand family with no vocabulary entry is a `NO FAMILY` verdict in
      `company_demand.md`, fixed by adding the `techniques.yml` entry, never by scheduling
      a problem reactively off the report. FIXES `pull_interview.read_tracker()`'s
      `(🟢|🟡|🔴|🏆)` alternation, which omitted 🎓 and silently dropped every graduated
      row from both `solved_slugs` and `learned_numbers`; also adds `"Strings":
      {"String"}` / `"Design": {"Design", "Data Stream", "Iterator"}` to
      `CATEGORY_TO_TOPICS` and `"strings": "Strings"` / `"design": "Design"` to
      `FOLDER_TO_CATEGORY` (no solution folders exist yet for either, so this is inert
      until one does). See `scripts/company_demand.py`, `scripts/pull_interview.py`
      (`read_tracker`, `CATEGORY_TO_TOPICS`, `FOLDER_TO_CATEGORY`),
      `docs/foundations/dsa/mastery/techniques.yml` (the four new sections, just above
      the DP framework-lenses block).
    affects: [technique_coverage, gamification, pull_interview]

  - id: interview-formats-parked-drill-sep26
