# Engine decisions — the dated record of when the model CHANGED.
#
# This is the other half of `cse.config.yml`. The config says what the values ARE; this says
# when and why they became that, and it is what rule files reconcile against.
#
# ── Why this file exists ──────────────────────────────────────────────────────────────────
# Rules go stale silently, and not because their vocabulary drifts — because their PREMISE
# expires. `feedback_unseen_on_non_sd_days` was entirely correct given "an SD day costs 3.0
# units against the day". When that stopped being true on Aug 16, 2026, nothing connected the
# two, and the rule kept reading as current for a day until a full manual audit found it.
#
# Two detectors were built first and neither can catch that class:
#   - a retired-VOCABULARY list only catches the spellings it was handed. It had `daily_cap`
#     and not "daily cap", so eight live instances of a superseded rule sat unflagged.
#   - the restated-VALUE check matches the CURRENT config value, so a line asserting a STALE
#     one (`ceiling 9.0`) is structurally invisible to it.
#
# Both failures are failures of WORDS. A date cannot be misspelled, and every rule file
# already has one — so a temporal check starts COMPLETE: nothing can be silently absent.
#
# ── How it works ──────────────────────────────────────────────────────────────────────────
# Each rule file carries `reconciled: YYYY-MM-DD` in its frontmatter. A rule whose
# `reconciled` date predates a decision below has NOT been read against that decision.
# `scripts/reconcile.py` reports those; bumping the date is the explicit act of saying
# "I read this rule against that decision, and it is either still right or now fixed."
#
# ⚠️ `reconciled` is a DELIBERATE field, never `git log -1` on the file. Git mtime measures
# "was edited", not "was re-examined" — a typo fix would have marked the most broken file in
# the repo as current. That distinction is the whole reason this is not automated.
#
# ⚠️ This does not remove the audit work. It makes it VISIBLE and TRACKED instead of
# invisible, which was the actual failure: nobody knew the backlog existed.
#
# ── What belongs here ─────────────────────────────────────────────────────────────────────
# Decisions that can STRAND A RULE — a changed value, a retired concept, a moved boundary.
# NOT every new rule: adding one stands on its own and invalidates nothing. If in doubt, ask
# "could a rule written before this still read as correct while now being wrong?"

decisions:
  - id: skill-layer-in-intervention-ladder
    date: 2026-09-10
    summary: >-
      The coaching engine moved out of the always-injected CLAUDE.md into a repo-local skill
      (.claude/skills/cse-coach/SKILL.md + references/), loaded only at coaching moments; CLAUDE.md
      dropped 899→168 lines / 70KB→~10KB and now carries only always-on gates, the register rules,
      single-source, decisions/reconcile, the token-discipline cap, and pointers. The intervention
      ladder's "numbered step" rung is now split by trigger: a COACHING-MOMENT rule goes in a skill
      reference (loads reliably at that moment); a CROSS-CUTTING / unprompted rule stays in CLAUDE.md
      (injected every turn). Skill files carry `reconciled:` (SKILL.md in frontmatter, references in an
      HTML comment) and are in reconcile.py RULE_GLOBS + check_single_source.py PROSE_GLOBS, so a future
      decision flags a stale reference and a restated tuned value is caught there too. The self-evaluation
      LOOP itself stays where it was (SessionStart hook gates 2/3 + feedback_self_evaluation.md) — it is
      not a coaching moment; only its distilled lessons live as dated warnings inside the references.
      Not an upstream sync: cse-progress had drifted ahead of canonical cse-coach and uses different
      paths, so the skill was authored from this repo's own current CLAUDE.md.
    affects: [operating_principles, self_evaluation, single_source, reconcile, scaffolding, review_workflow, effort_budget, weekly_build, technique_coverage, system_design]

  - id: complexity-probe-drill
    date: 2026-09-06
    summary: >-
      NEW standing drill (pinned Sep 2, decided Sep 6): the cold complexity probe. The coach fires an
      already-solved 🟢/🎓 problem during a warmup; the learner states time + space COLD on the existing
      code, with the why — no re-solving, no new file. Cadence ~2 per warmup-week, woven into warmups
      (rides free like the recognition gate). Disposable: only a MISS is carded (in the new probe ledger
      in complexity_gotchas.md) and re-queued; a repeated same-category miss escalates to a teach.
      Distinct from the end-of-week clean-code cleanup queue (that re-asks a bound missed on a clean-code
      rep THIS week; the probe fires cold on any mature problem to keep the miss-cluster categories fresh).
      Learner picked "2/warmup-week, ledger-tracked" over a weekly batch of 5. Mechanism lives in
      complexity_gotchas.md.
    affects: [complexity_gate, complexity_gotchas, weekly_build]

  - id: grid-bfs-not-thinned
    date: 2026-09-06
    summary: >-
      Considered thinning the Grid BFS cluster (200, 130, 417, 733) after the learner read it as
      over-tested (417 greened to s2 Sep 6). DECLINED — leave it. The cluster is already nearly free:
      733 is 🎓, 200/130 are s2, the whole cluster generates ~0.17 reps/week, so thinning saves almost
      nothing. "Over-tested" is a feeling; the cost is near-zero because the members are mature. 417 (s2)
      graduates itself on its next clean and can retire normally. Fast-tracking 417 to 🎓 was separately
      refused — the coverage gate needs a HARDER same-technique sibling on the normal ladder and none
      exists (all Grid-BFS problems are Medium/Easy).
    affects: [scheduling, ratings]

  - id: greedy-backtracking-overlap
    date: 2026-09-06
    summary: >-
      Greedy sub-track (Intervals + Greedy phase) runs one week long: 45/763/134/846 land Sep 7–13, and
      the last two (1899 Merge Triplets, 678 Valid Parenthesis String) carry into the Sep 14 week as they
      come due. Backtracking OPENS ON SCHEDULE Sep 14 (22 Generate Parentheses first) — it is not delayed
      for two easy greedy carries, since it is Hard/dense and a delay pushes the whole roadmap (incl. DP,
      Oct–Nov) back. So Greedy and Backtracking overlap for the Sep 14 week. Phase dates are advisory
      (feedback_phase_dates_are_advisory) — a normal carry, not a slip.
    affects: [scheduling, curriculum]

  - id: four-sum-retired-redundant-with-3sum
    date: 2026-09-06
    summary: >-
      18. Four Sum retired. Learner solves it with a set instead of the intended
      two-pointer-after-sort form, which collapses it into a re-run of 3Sum's pattern
      plus a wrapper loop rather than a distinct rep — no new recognition or execution
      challenge over 3Sum. Row dropped, not deferred; no trigger to bring it back unless
      a set-based approach becomes the thing worth drilling.
    affects: [dsa_progress, scheduling]

  - id: complexity-cleanup-formalized
    date: 2026-09-03
    summary: >-
      FORMALIZES the provisional complexity-miss-off-rep-drill (Sep 2). The clean-code complexity
      waiver is now a standing rule, not a per-rep override: when recognition AND code were clean off
      a blank page and the ONLY miss was a Big-O bound, the miss does NOT cap the comfort rating (rate
      on the code) — it is instead queued for an END-OF-WEEK COMPLEXITY CLEANUP, where the coach
      re-asks the bound cold on the existing code at the weekly close-out (no re-solving). Clean →
      clear; missed again → escalate to a complexity teach on that category. Scope is exactly clean
      code + Big-O miss; a complexity miss alongside a code fix keeps the normal freebie→🟡 cap.
      Learner: "we do an end of week cleanup for clean code and big O misses only." Rationale: the code
      rep and the complexity concept are different learning units; re-repping clean code to re-test a
      concept is churn. Mechanism: cleanup-queue table in complexity_gotchas.md (rule 4); close-out
      step in CLAUDE.md workflow step 7; why in feedback_ask_complexity. First applied to 743 (space
      heap-O(E) attribution, logged 🟢 🟡→🟢, queued).
    supersedes: [complexity-miss-off-rep-drill]
    affects: [complexity_gate, ratings, complexity_gotchas, feedback_ask_complexity, weekly_closeout]

  - id: familiarity-discounting
    date: 2026-09-03
    summary: >-
      Effort pricing now discounts for demonstrated familiarity, in three composed layers:
      (A) streak-graded green base (🟢 s0 1.0 → s1 0.8 → s2 0.6 → 🎓 0.5), (B) earned
      difficulty demotion (a proven 🟢 s2+/🎓 problem prices one tier easier — a worn Hard
      bills like a Medium), (C) attempt-count decay for CHRONIC 🔴/🟡 only (≥5 attempts,
      −5%/attempt, floored at −30%). Prompted by the learner: a Hard doesn't feel like 3.0
      or 4.5 after many attempts. Guardrails: no ordering inversion, and conversion pressure
      on fresh (<5-attempt) blanks is untouched. New keys in cse.config.yml under
      effort_budget: green_streak_units, difficulty_demotion, attempt_decay. All routed
      through effort_budget.py's single price() function. Library demand fell ~5.4 → 4.5
      units/day at adoption. The ceiling stays 8.0 — this re-prices demand, not quality.
    affects: [effort_budget, scheduling]

  - id: complexity-miss-off-rep-drill
    date: 2026-09-02
    summary: >-
      POLICY SET BY LEARNER (provisional — to be formally DESIGNED at the Sep 7 build, not yet
      wired): a complexity miss no longer caps a comfort rating when recognition AND code were
      clean off a blank page. The recurring miss is a complexity CONCEPT (e.g. string-is-not-O(1),
      bounded-state-space word-vs-bit), not the problem's code — re-repping clean code to re-test
      the concept is churn. The concept is instead drilled OFF-REP via a planned cold "complexity
      probe" (fire code -> learner gives T/S cold, no writing; tracked in complexity_gotchas.md,
      disposable). First applied to 127 (over-learned code, waiver) then generalized on 202 Happy
      Number (space O(1) missed, cued) at the learner's explicit call. ⚠️ SUPERSEDES the
      freebie/repeat 🟡-cap rule from feedback_ask_complexity FOR THE clean-code case ONLY — until
      Sep 7 this is a per-rep learner override recorded in the ledger, NOT yet a rewritten gate.
      The rating gate + freebie rule still stand as written until the build formalizes this.
    affects: [complexity_gate, ratings, complexity_gotchas, feedback_ask_complexity, probes]

  - id: stack-expression-ladder-parked
    date: 2026-08-31
    summary: >-
      224 Basic Calculator is PARKED beside 227, for the same reason: both were authored to
      justify their own base (150), never frequency-pulled. The Stack-expression 2nd problem
      is now 394 Decode String (Google pull, freq 58.3), and both parked rungs re-gate on
      `rated:394`. Applies coverage-sibling-pulled-not-authored to the rungs already in the
      plan, not just to future ones.
    affects: [scheduling, waiting_room, consolidation_reps]

  - id: interval-flavours-declared
    date: 2026-08-28
    summary: >-
      "Intervals (sort + sweep)" now declares five VARIANTS keyed by sort key + answer shape
      (merge-by-start, insert-into-sorted, schedule-by-end, max-concurrent sweep-line,
      two-list intersection), and min_problems moves 3 -> 5. Before this the technique
      declared no variants at all, so the coverage report read "3 (56,57,435)" with the bar
      met and could not surface a breadth gap even in principle. The two uncovered flavours
      are queued on green:435 / green:56 rather than scheduled -- the technique is zero-green
      across all three problems it has.
    affects: [technique_coverage, techniques_vocabulary, intervals]

  - id: sibling-gate-yellow-not-green
    date: 2026-08-23
    summary: >-
      A thin-technique coverage sibling now gates on the standard 🟡+ consolidation gate, NOT on
      `green:base`. Learner: "for the techniques without proper coverage, we can drop the gate on
      another problem being green." The `green:base` hold (224 on green:150, Floyd Fast/Slow on
      green:202) over-tightened: for a thin technique a second problem is another path to the
      technique's FIRST 🟢 and trains transfer that re-repping one problem can't, so gating coverage
      behind the base going green can deadlock a technique stuck at 🟡. ONE guard retained (what
      green:base was a blunt proxy for): a HEAVILY coach-guided 🟡 — near-🔴, multiple coach-supplied
      fixes per the stuck_log — counts as 🔴 for sibling purposes, convert/teach first (§2a: a sibling
      on an unlearned base just double-blanks). Effect: 224/227 (Stack-expr, 150 clean-🟡) and Floyd
      Fast/Slow (Cycle, 202 🟡) unblock; 239 Monotonic Deque (3 coach fixes Aug 22) stays gated.
      Recorded in techniques.yml (Floyd Fast/Slow trigger) and feedback_consolidation_reps.
    affects: [consolidation, coverage, waiting_room, techniques_yml]

  - id: binary-search-two-axes
    date: 2026-08-30
    summary: >-
      Binary-search vocabulary restructured into TWO INDEPENDENT AXES, replacing a taxonomy that
      was asymmetric and hid a gap. AXIS 1 (what you converge on): exact match | min boundary |
      max boundary. AXIS 2 (what you search over): the array | the answer space. A problem is
      listed under one entry per axis it exercises — the schema already allowed this (74 sat in
      two entries before the change). THE DEFECT: `Binary Search (max boundary)` was already
      keyed on the BIAS and already spanned both search spaces (74 array-space, 1552
      answer-space), but the min side was not keyed that way at all — its answer-space half sat
      in `Binary Search on Answer` and its array-space half was never named, diffused through a
      generic seven-problem `Binary Search` bucket that also held the exact-match problems. So
      coverage reported "Binary Search: 7 problems, healthy" and was structurally unable to
      answer "how many min-boundary reps do I have?" — the identical failure the Aug 17
      max-boundary note describes, mirrored onto the other bias. CHANGES: generic `Binary Search`
      split into `Binary Search (exact match)` (704, 33) and `Binary Search (min boundary)` (153,
      2300, 162, 540, 875, 1011); `Binary Search on Answer` KEPT as the second axis rather than
      folded in (learner: "keep as second axis, harder problems typically have more than just one
      axis" — recognizing you must MANUFACTURE the search space is a distinct recognition skill
      from knowing which bias to use once you have one) and gains 1552, which is answer-space with
      the MAX bias and whose absence was what made that axis read as a min-only concern. 875/1011
      are min-boundary practice regardless of searching the answer space — the learner's point,
      and why they are listed on both axes. 540 placed on min boundary at the learner's call
      (first index where pair-start parity breaks — a predicate boundary, never a target compare).
      FOUND when 153 graduated Aug 30 and the learner asked for coverage on both boundaries.
      EFFECT ON THE BOARD: max boundary is the real gap at 1/3 (74 only — 34 and 1552 are queued
      but untracked, so they do not yet count); min boundary reads 6 and healthy, confirming the
      learner's intuition that it is the default form. 34 and 1552 were already seated for the
      Aug 31 week and closing them also takes `on Answer` to 3/3.
    affects: [techniques_yml, coverage, recognition]

  - id: coverage-sibling-pulled-not-authored
    date: 2026-08-29
    summary: >-
      The candidate POPULATION for a coverage sibling is a company frequency pull first
      (`pull_interview.py --technique <t>`); author or hand-pick only if the pull does not yield
      enough coverage. Learner: "let's make sure the population comes from company pulls first and
      then we can reach for others if there is not enough coverage" — clarified as meaning the pool
      that provides a TECHNIQUE's coverage, not intake generally. feedback_consolidation_reps
      specified WHEN a technique needs another problem and was silent on WHERE it comes from, so the
      source defaulted to coach invention. Found via 227 Basic Calculator II: never in NC150, never
      in a pull, entered Aug 11 solely to justify 150 Evaluate RPN after the learner rejected it
      ("it's the base rung under 224/227/772") — a thin problem generating its own sequel. The
      learner independently reached the same verdict two weeks later ("feels like a brain teaser
      than an actual technique check"). COROLLARY, the sharper half: if a rung exists only to
      justify the problem below it, re-examine the RUNG — do not schedule the sequel. This is
      EXEMPT from feedback_expansion_pull_scheduling's post-NC150 gate, which governs filling
      application slots, not sourcing a sibling. Effect: 227 parked (trigger = rated:<pulled
      Stack-expr sibling>, scaffold deleted so discovery mints no phantom row); 224 flagged for
      re-examination rather than seated by default.
    affects: [consolidation, coverage, waiting_room, pull_interview, study_guide]

  - id: fill-capacity-with-weak-coverage
    date: 2026-08-23
    summary: >-
      When built days sit UNDER the daily ceiling, fill toward it with weak-technique work BEFORE
      deferring that work to a later week — priority order: zero-green conversions & their coverage
      siblings > thin-green fills > backlog. Learner: days at 7.0 felt light while zero-green coverage
      sat deferred to the next week. Prefer ADDING a new sibling problem over pulling an existing
      review forward (trains transfer + a fresh 🟢 path, no interval shortening). The ≤2/week
      consolidation cap may be flexed up when the tracker is under-subscribed (headroom) and the extra
      intake targets zero-green/thin techniques — the cap guards an over-subscribed tracker, not an
      under-subscribed one. Recorded in feedback_surplus_triggered_intake.
    affects: [scheduling, effort_budget, consolidation, weekly_build]

  - id: rating-gate-hook
    date: 2026-08-23
    summary: >-
      New Stop hook `.claude/hooks/rating_gate.py`, at the learner's request ("put a clear gate at
      the rating where it requires code completion + time and space complexities given"). It blocks a
      turn that PROPOSES a comfort rating (comfort marker + a proposal cue like "confirm?"/"→ Sep 2")
      when the learner has not stated BOTH time and space complexity in their recent messages. Binds
      the complexity gate to the exact moment it kept failing — the rating proposal — after that gate
      was run backwards twice (15 on Aug 22, 127 on Aug 23: rating proposed with an axis missing).
      Rung-2 fix (hook) above the rung-4 memory note. Checks the LEARNER's transcript, not a
      self-asserted checklist (ungameable). Detection is keyword-based per axis (no Big-O-count credit,
      which misfires when both O()s are one axis — the 127 case); accepted conservative cost is a single
      block on an axis stated only as a bare O() with no word, which the re-send clears (stop_hook_active).
      Does NOT check correctness of the bound or the freebie ledger — those stay judgement. Wired into
      settings.json Stop alongside problem_link_reminder. See feedback_ask_complexity (ledger-read-before-rating).
    affects: [complexity_gate, rating, hooks]

  - id: link-orphan-reemit-fix
    date: 2026-08-23
    summary: >-
      Two changes to stop a hook-forced link re-emit from reading as a directive (learner: "are you
      linking 901 because you want me to do it first?"). (1) Behavioral, the real fix: in prose, refer
      to a problem by name/role, never a loose number — a number appears only inside its [file]·[LC]
      pair — so the Stop link hook never fires mid-turn and no context-free orphan is created. (2) Hook
      backup: problem_link_reminder.py's block message now permits the fixed tag "(links owed, order
      unchanged)" on a forced re-emit so a debt-payment can't be misread as a pick. Recorded in
      feedback_kickoff_table_links.
    affects: [links, hooks]

  - id: technique-comfort-audit
    date: 2026-08-22
    summary: >-
      New weekly artifact `mastery/technique_comfort_audit.md` and generator
      `scripts/technique_comfort_audit.py`, at the learner's request. A technique-keyed
      PROGRESSION view (distinct from technique_coverage.md, which is gap-keyed): per-technique
      comfort = demonstrated ceiling, auto-rolled from the tracker by reusing the coverage join;
      coverage counts temper it; WHY-lines are hand-authored and PRESERVED across regens; and a
      FUTURE section lists roadmap algorithms not yet started (⚪) with a why, preserved verbatim
      between markers. Refreshed at the weekly build (step 7), NOT the pre-commit hook — it is a
      weekly artifact and per-commit churn would fight the preserved narrative. Adds nothing to the
      engine's computed values; it is a reporting surface only, so no rule written before it can go
      stale because of it. Carries a generated "Needs work" callout at the top (zero-green weakest-first,
      then thin-green) that is the weekly build's PULL-ORDER source, with the priority ruling:
      🔴/🟡 conversions > overdue 🟢 cleans > thin-green fills + probes — a zero-green technique outranks
      discretionary work and fresh cleans, but NOT a clean aged far past its interval (that is a
      retention risk that makes new demand and must still be serviced).
    affects: [weekly_build, technique_coverage, reporting, effort_budget]

  - id: recognition-block-removed-from-scaffold
    date: 2026-08-22
    summary: >-
      The RECOGNITION block is no longer written into scaffolds. new_problem.py's
      recognition_block() is disabled (returns []) and the template's {recognition} line is
      removed, so fresh attempts go straight from the Attempt banner to the def. Completes
      recognition-call-is-the-top-comment (Aug 21), which had already made the block optional
      after the learner declined it as a format twice; on Aug 22 they asked to remove it
      outright ("I always write underneath"). The gate itself is UNCHANGED — the learner's
      top-of-method comment is still the pre-code call, and the coach still fires it verbally
      with SHAPE CUES ONLY, never candidate techniques (the 239 leak). Anti-spoiler protection
      now rests on that habit plus coach discipline, not on a printed prompt. Supersedes the
      MEANS of recognition-gate-in-scaffold (Aug 20); its END (contentless prompting) stands.
    affects: [recognition_gate, scaffolding, no_spoilers]

  - id: two-registers-latitude-vs-stringency
    date: 2026-08-21
    summary: >-
      Rules are now SCOPED to a register instead of reading as universal. DELIBERATIVE work (thinking,
      planning, researching, teaching, interviewing) is unbounded in content — only the packaging rules
      (turn economy, register, pacing, no-spoilers, answer-length) bind. MECHANICAL work (implementing,
      bookkeeping, pulling a stated detail) follows every checklist as a hard gate. The test: would a
      second competent agent produce the same artifact? Yes -> mechanical. Gates (recognition,
      complexity, links, ask-before-commit) are mechanical steps that fire DURING deliberative work, so
      "I was teaching" never excuses a skipped one. Any rule written for a status report must be
      re-read before being applied to an explanation. Options for subagents and hooks were logged and
      held with state triggers — see project_agent_latitude_modes.
    affects: [operating_principles, answer_length, turn_economy, self_evaluation, teaching]

  - id: recognition-call-is-the-top-comment
    date: 2026-08-21
    summary: >-
      The learner's own TOP-of-method comment IS the pre-code recognition call; inline comments are
      mid-code reasoning. The scaffold's RECOGNITION block is an OPTIONAL place to record the call,
      never a required form — do not re-demand it when the top comment already carries the call, and
      do not read a blank block as a missing gate. Narrows recognition-gate-in-scaffold (Aug 20),
      whose block was the MEANS of contentless prompting, not the end: prompting still names shape
      cues only, never candidate techniques. Learner declined the block as a format twice on Aug 21,
      on two machines independently ("doesn't feel conversational enough" / "I always write my
      pre-code comment on top"). Enforcement is trust-based and accepted — no tool can prove a
      comment preceded the code; the honest measure is the label-stripped probe hit rate over ~15
      probes, not per-rep policing.
    affects: [recognition_gate, scaffolding, no_spoilers]

  - id: recognition-gate-in-scaffold
    date: 2026-08-20
    summary: >-
      The recognition gate is written INTO the scaffold by new_problem.py (a RECOGNITION block
      the learner fills before coding), not delivered verbally by the coach. Source fix for a
      spoiler: a verbally-delivered gate can leak the technique by naming candidates (done on 239).
      When the coach does speak first, name only shape cues, never candidate techniques.
    affects: [recognition_gate, scaffolding, no_spoilers]

  - id: pace-flat-discipline
    date: 2026-08-20
    summary: >-
      Coach ends every turn at the answer; the learner drives every transition. No coach-initiated
      "next". Stronger than the prior "no ready? tail" — removes coach-initiated progression
      entirely. Set by the learner after two pacing slips in one session.
    affects: [let_learner_pace, turn_economy]

  - id: midweek-reprice
    date: 2026-08-17
    summary: >-
      The weekly build's "what does not fit" verdict expires as results land. Re-run
      effort_budget.py after logging reps and re-seat from the slip list when headroom opens.
    affects: [scheduling, effort_budget, weekly_build]

  - id: answer-length-cap
    date: 2026-08-17
    summary: >-
      An answer to a QUESTION is capped at one small paragraph and must be scannable
      (bullets/table over dense prose); explaining what you DID is uncapped and unprompted.
    affects: [turn_economy, token_discipline]

  - id: single-source-of-truth
    date: 2026-08-17
    summary: >-
      Every tuned value is stated in cse.config.yml and nowhere else. Prose points, never
      copies. Enforced by scripts/check_single_source.py from the pre-commit hook.
    affects: [intervals, effort_budget, graduate_at_streak]

  - id: probe-difficulty-by-technique
    date: 2026-08-17
    summary: >-
      Recognition probes pick the TECHNIQUE first, then the easiest unseen problem that
      forces it; per-technique ratchet Easy -> Medium; capped at Medium. Easy-only could not
      reach most banked techniques.
    affects: [recognition_probes, effort_budget]

  - id: ask-before-commit
    date: 2026-08-16
    summary: >-
      ASK before EVERY commit and EVERY push, no exceptions. Replaced "commit once at session
      end", whose judgement clause was a loophole — 31 commits ran under it in one session.
    supersedes: [batch-commits-at-session-end]
    affects: [git_workflow, session_close]

  - id: sd-unpriced
    date: 2026-08-16
    summary: >-
      SD is off-board and UNPRICED. The ceiling was lowered instead, so the SD evening is
      charged once on every day rather than per SD slot. sd_lane_units/sd_deep_dive_units
      retired; effort_budget.py --sd adds 0.
    supersedes: [sd-lane-price-raised]
    affects: [effort_budget, system_design, scheduling]

  - id: ceiling-lowered
    date: 2026-08-16
    summary: The daily effort ceiling was lowered; it is now the honest DSA-only number.
    affects: [effort_budget, scheduling]

  - id: sd-boundary-is-content
    date: 2026-08-16
    summary: >-
      Only HelloInterview-excerpt material stays private. study_guide.md and the SD tracker
