# Engine config, read by scripts/update_review_dates.py.
# Intervals and source root default to the standard values; the one non-default
# here is discovery_skip.

# Raised 5 → 7 on Aug 6, 2026 for the senior-fintech ramp. The extra +2/day (+14/week)
# is REVIEW/backlog capacity only — new-problem intake stays capped at the difficulty
# tiers (moderate 5 / hard 4 / DP 3), so the surplus deficit and 🟢 backlog drain instead
# of the blank-tax cascade growing. This is what funds finishing the DSA roadmap (incl.
# DP, Oct–Dec) AND the SD ramp in parallel, rather than stealing the DSA active block.
#
# ⚠️ SUPERSEDED Aug 7, 2026 by `effort_budget` below. Kept as a fallback for any tool that
# still reads it (nothing does today — it was always a convention the coach enforced by
# reading this file, never a value a script consumed).
daily_cap: 7

# Review intervals — made EXPLICIT Aug 16, 2026. These are the script's own defaults
# written out, so the numbers are visible here instead of living only in
# scripts/update_review_dates.py's DEFAULT_CONFIG. Behaviour is unchanged: verified by
# re-running the tracker and diffing (no rows moved).
#
# Why bother: CLAUDE.md documents `clean_provisional` as "configurable in cse.config.yml",
# and until now that knob did not exist in this file — the value was only reachable by
# editing the script. sd-progress already carries the explicit block; this closes the gap
# between the two repos.
#
# ⚠️ Read the glyph warning on `effort_budget` below before adding any word-keyed block
# to this file. The Aug 7, 2026 incident was an effort-budget draft keyed by
# blank/shaky/... being scraped as THESE values (Shaky 10 -> 2 days, Graduated 180 -> 0).
# A real `intervals:` block is the safe place for those words; nowhere else is.
intervals:
  clean:
    provisional: 10   # a 🟢 directly after a 🔴 — Streak 0, lock-down check
    streak1: 30
    streak2: 60
    graduated: 180    # 🎓 streak-3 tier, recurring spot check
  shaky: 10
  blank: 2

# Streak at which a 🟢 row becomes 🎓 Graduated. `retire_at_streak` is accepted as an
# alias by the script (Jul 26, 2026 rename); cse-coach's example config still uses that
# older spelling.
graduate_at_streak: 3

# The effort budget — replaces the problem COUNT cap with a cost-weighted one.
# Full rationale, calibration and the decision log: docs/foundations/effort_budget.md
#
# Why: a problem is not a unit of work. Thu Aug 6, Fri Aug 7 and Sat Aug 8 were each
# "7 problems" and measured 5.5 / 8.0 / 10.5 units — the count cannot tell a five-minute
# 🟢 Easy from a 🔴 Hard, and every weekly schedule note reading "Saturday is the heaviest
# day by some margin" was a human correcting for that in prose.
effort_budget:
  # units = comfort_units × difficulty, rated by the comfort the row carries GOING IN
  # (never the one it earns — the budget is built before the day runs).
  #
  # ⚠️ KEYED BY GLYPH ON PURPOSE, not by the words blank/shaky/clean/graduated. Those
  # words are exactly what update_review_dates.py's fallback config scrape searches for,
  # and on Aug 7, 2026 an earlier draft of this block (`{blank: 3.0, shaky: 2.0, ...}`)
  # was read as INTERVALS: Shaky went 10 days -> 2, Graduated 180 -> 0, and three rows
  # were silently written with wrong review dates. The parser is fixed to read YAML
  # structure, but the glyph keys mean even the fallback path cannot collide.
  comfort_units:
    "🔴": 3.0
    "🟡": 2.0
    "🟢": 1.0
    "🎓": 0.5
  difficulty: {Easy: 0.5, Medium: 1.0, Hard: 1.5}

  # ── Familiarity discounting (added Sep 3, 2026) ─────────────────────────────────────
  # The flat `comfort_units × difficulty` price could not tell a Hard seen twice from a
  # Hard wrestled eight times. The learner: "a Hard doesn't always feel like 3 or 4.5
  # points after multiple attempts." Three layers now discount for demonstrated
  # familiarity — but ONLY where it is earned, so the conversion pressure the budget
  # exists to apply (a 🟡 bills ~12× a 🟢 forever) is preserved on genuinely-stuck rows.
  # Full derivation: docs/foundations/effort_budget.md. Decision: `familiarity-discounting`.
  #
  # The unified price is:  base(comfort, streak) × difficulty(tier, demoted?) × attempt_factor
  # `effort_budget.py` is the single implementation; nothing else prices a day.

  # (A) Streak-graded green — a 🟢 proven across more reps costs less, decaying toward 🎓.
  # Keyed by streak (int). A streak past the top key uses the top key; a missing block
  # falls back to comfort_units["🟢"]. Reds/yellows are untouched here (they have no streak).
  green_streak_units:
    0: 1.0
    1: 0.8
    2: 0.6

  # (B) Earned difficulty demotion — once a problem is PROVEN (🟢 at min_streak, or 🎓),
  # its intrinsic tier stops mattering as much: it prices one difficulty tier easier.
  # This is what makes a well-worn Hard bill like a Medium. Only fires on proven rows,
  # so it never cheapens a struggling one.
  difficulty_demotion:
    trigger: {comfort: "🟢", min_streak: 2}   # 🎓 always counts as proven
    map: {Hard: Medium, Medium: Easy, Easy: Easy}

  # (C) Attempt-count decay — relief for CHRONIC rows only. Applies to 🔴/🟡 (greens are
  # handled by A+B) and does NOTHING before min_attempts, so a fresh blank stays full price
  # and the teach-first incentive on new struggles is intact. After that, −per_attempt for
  # each attempt beyond (min_attempts − 1), floored so a chronic 🔴 Hard never drops below
  # the priciest cleaner tier (no ordering inversion). Conservative by design — steepen
  # per_attempt / lower floor if familiar reps still feel heavy.
  attempt_decay:
    applies_to: ["🔴", "🟡"]
    min_attempts: 5
    per_attempt: 0.05
    floor: 0.70

  # A hard ceiling, one number for every day (not per-day) — decided by the learner
  # Aug 7, 2026. It is NOT derived from demand, and must never be raised to chase a
  # deficit: on a Medium row a 🟡 bills 73 units/year against 🟢 s2's 6.1, so a rep
  # rushed into a 🟡 costs 12× forever. Raising the ceiling to catch up increases
  # future demand. Starting value is a calibrated guess — see the doc for how to
  # settle it from the tracker once there is enough data.
  # Lowered 9.0 -> 8.0 on Aug 16, 2026 by the learner: "it is getting harder to fit in
  # SD filling DSA with 9 points each day, so I might want to lax back to 8."
  #
  # The underlying finding is that the budget was pricing the wrong universe. SD moved to
  # a separate repo on Aug 13 and is self-directed study, so it is OFF-BOARD and UNPRICED
  # while still consuming the same evening. A day the script called 9.0 was really 9.0 plus
  # whatever SD took. 8.0 is the honest number, not a concession.
  #
  # This is the ceiling rule running in the direction it was written for: never RAISE the
  # ceiling to chase a backlog, because a rep rushed into a shaky costs ~12x forever.
  # Lowering is cheap by the same logic - demand sets the floor, the ceiling is a quality
  # judgement.
  ceiling: 8.0

  # "Always do something" minimum. Advisory floor is ceil(demand) ≈ 7 units/day today;
  # this is the hard one beneath it, so a bad day still lands somewhere.
  floor_min: 3.0

  # ⚠️ RETIRED Aug 16, 2026 — SD IS NO LONGER PRICED. Both keys below are commented out
  # rather than left as live data, because a live key gets read back.
  #
  # The model changed and these did not: the ceiling drop 9.0 -> 8.0 (see its note above)
  # made 8.0 the honest **DSA-only** number, sized so SD fits the leftover evening. Charging
  # an SD slot against that same lowered ceiling would bill it twice. `system_design.cadence`
  # below STAYS — it decides how many SD slots a week gets, and the week is still built here;
  # only the *pricing* is gone. So: SD is scheduled here, unpriced, and executed in
  # sd-progress.
  #
  # The calibration history is kept below because it is the record of how the number was
  # settled, not because the number is live.
  #
  # --- retired ------------------------------------------------------------------------
  # An SD lane slot costs this much against the day's budget. Sunday is where
  # over-scheduling has been flagged twice, and the design session is real work.
  #
  # ⚠️ RAISED 2.0 -> 3.0 on Aug 9, 2026 by the learner: "SD typically tire me out more."
  # This adds NO work — it corrects the price of work already being scheduled. At 2.0 an
  # SD day measured ~7 while feeling like ~8+, so the budget was quietly under-reporting
  # exactly the days that ran hardest, and the correction was being made in prose the way
  # the problem COUNT used to be (see the note at the top of this block — same failure,
  # one level down).
  #
  # The mechanical effect is the point: an SD slot now consumes a third of the ceiling, so
  # the scheduler fits FEWER DSA problems alongside it. SD days get lighter in DSA terms
  # without anyone having to remember to make them lighter.
  #
  # Calibration evidence: Sun Aug 9 priced 8.5/9 and ended with the learner too tired to
  # finish step 4 of the design. At 3.0 that same day prices 9.5 — over ceiling, which is
  # the honest reading of what happened.
  # The Sunday MOCK costs this. Unchanged at 3.0 through the Aug 13 rework — a cold 45-min
  # mock is at least as tiring as the design session this price was calibrated on.
  #   sd_lane_units: 3.0
  #
  # The midweek DEEP-DIVE ROUND costs this. Shorter (~25 min) and narrower (rubric #5/#6/#7
  # on an already-mocked design, no framework walk), so it prices below a full mock.
  #   sd_deep_dive_units: 2.0
  # --- end retired --------------------------------------------------------------------

system_design:
  # ⚠️ REBUILT Aug 13, 2026 — the three-lane study model is retired. The learner studies
  # system design independently on HelloInterview; the coach runs cold mock interviews on
  # HelloInterview's 35-question board and scores them on the 7-point rubric.
  #
  #   Sunday          → THE MOCK: one cold ~45-min mock on the next question + ~15 min
  #                     debrief written to sd-progress/mocks/. 3.0 units.
  #   One midweek     → THE DEEP-DIVE ROUND: ~25 min of pushback on a design already
  #                     mocked, drawn from that debrief's open-probe bank. 2.0 units.
  #                     CONDITIONAL — it does not exist until something is banked, and the
  #                     slot returns to DSA warmups when the probe bank is empty.
  #
  # Lanes ①/②/③ are gone, and so are note-building reps, Recall-Card blind sprints, the
  # Bootstrap→Transition→Mastery arc, the designs-pull-blocks queue and the prereq-tech
  # gate. Why, and what replaced each: sd-progress/study_guide.md.
  #
  # ⚠️ MOVED Aug 15, 2026 — the SD track itself now lives in the private repo
  # https://github.com/michael-yrao/sd-progress (HelloInterview is paid content and its
  # debriefs are where excerpts land). This key STAYED because it decides how many slots a
  # WEEK gets, and the week is built here, in docs/foundations/schedules/ — one cross-track
  # table that plans DSA warmups, the DSA active block and the SD slots against one budget.
  # ⚠️ The rest of that Aug 15 note said `sd_lane_units` stayed for the same reason. That was
  # superseded the NEXT DAY by the ceiling drop — SD is off-board and unpriced; this key
  # decides SLOT COUNT only, never cost. See the retired block above.
  #
  # So: the SD slot is SCHEDULED here and EXECUTED there. The mock's debrief, its rating and
  # its tracker row land in sd-progress; the computed next-review date comes back to a
  # schedule file here, same as any other rep.
  cadence: mock_plus_deep_dive

solutions:
  roots: ["dsa/leetcode"]
  globs: ["*.py"]

# Problem numbers whose source file exists but should NOT be auto-added to the
# tracker (they re-enter when properly solved and logged).
discovery_skip: [76, 1216, 974]   # 76 Minimum Window Substring — parked
                             # 974 Subarray Sums Divisible by K — DISPOSABLE consolidation rep
                             #      (Aug 18, 2026). A consolidation rep earns a tracker row ONLY
                             #      on 🟡/🔴; a 🟢 leaves no permanent demand. ⚠️ REMOVE this entry
                             #      if it comes back 🟡/🔴 — otherwise discovery is suppressed on a
                             #      problem that genuinely needs repeating.
                             # 1216 Valid Palindrome III — phase-gated; the Knowledge
                             #      Expansion Queue owns it. Without this, discovery
                             #      re-injects it into the review table as a 🔴 with no
                             #      attempt dates, restarting the +2-day churn that
                             #      phase-gating exists to stop.
